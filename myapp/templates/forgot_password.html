<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password</title>

    <link rel="stylesheet" href="forgot_password.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

<div class="container">

    <div class="card">

        <div class="icon">
            <i class="fas fa-lock"></i>
        </div>

        <h2>Forgot Password?</h2>

        <p>
            Enter your registered email address.<br>
            We'll help you reset your password.
        </p>           <br>     
    
      {% if messages %}
    {% for i in messages %}
        <div class="alert-message">
            {{ i }}
        </div>
    {% endfor %}
{% endif %}
        <form action="/myapp/forgotpassword_post/" method="post">
            {% csrf_token %}

            <div class="input-box">
                <i class="fas fa-envelope"></i>
                <input type="email"
                       name="email"
                       placeholder="Enter Registered Email"
                       required>
    
            </div>

            <button type="submit">
                <i class="fas fa-paper-plane"></i>
                Send Reset Link
            </button>

        </form>

        <a href="/myapp/login_page/" class="back">
            <i class="fas fa-arrow-left"></i>
            Back to Login
        </a>

    </div>

</div>
<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#111827);
    padding:20px;
}

.container{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:450px;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(18px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:18px;
    padding:45px 35px;
    text-align:center;
    color:#fff;
    box-shadow:0 20px 40px rgba(0,0,0,.45);
}

.icon{
    width:90px;
    height:90px;
    border-radius:50%;
    background:#2563eb;
    display:flex;
    justify-content:center;
    align-items:center;
    margin:0 auto 20px;
    font-size:38px;
    color:#fff;
}

.card h2{
    font-size:30px;
    margin-bottom:12px;
}

.subtitle{
    color:#cbd5e1;
    font-size:15px;
    line-height:24px;
    margin-bottom:25px;
}

.alert-message{
    background:#fee2e2;
    color:#b91c1c;
    border:1px solid #ef4444;
    border-radius:10px;
    padding:12px;
    margin-bottom:20px;
    font-weight:600;
    animation:fadeIn .4s;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(-10px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

.input-box{
    position:relative;
    margin-bottom:20px;
}

.input-box i{
    position:absolute;
    left:18px;
    top:50%;
    transform:translateY(-50%);
    color:#9ca3af;
    font-size:18px;
}

.input-box input{
    width:100%;
    height:52px;
    border:none;
    outline:none;
    border-radius:10px;
    background:#1f2937;
    color:#fff;
    padding-left:48px;
    font-size:16px;
}

.input-box input::placeholder{
    color:#9ca3af;
}

button{
    width:100%;
    height:52px;
    border:none;
    border-radius:10px;
    background:#2563eb;
    color:#fff;
    font-size:17px;
    font-weight:600;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#1d4ed8;
    transform:translateY(-2px);
}

.back{
    display:inline-block;
    margin-top:20px;
    color:#60a5fa;
    text-decoration:none;
    font-size:15px;
    transition:.3s;
}

.back:hover{
    color:#fff;
}
</style>
</body>
</html>
