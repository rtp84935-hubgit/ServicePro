<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Change Password</title>
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Segoe UI',sans-serif;
}

body{
    background:linear-gradient(135deg,#0f172a,#1e293b);
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.container{
    width:420px;
}

.card{
    background:rgba(255,255,255,0.08);
    backdrop-filter:blur(12px);
    border:1px solid rgba(255,255,255,0.15);
    border-radius:18px;
    padding:35px;
    box-shadow:0 15px 35px rgba(0,0,0,0.4);
}

.card h2{
    color:#fff;
    text-align:center;
    margin-bottom:8px;
}

.card p{
    color:#cbd5e1;
    text-align:center;
    margin-bottom:30px;
    font-size:14px;
}

.input-box{
    position:relative;
    margin-bottom:22px;
}

.input-box input{
    width:100%;
    padding:14px 45px 14px 45px;
    border:none;
    outline:none;
    border-radius:10px;
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:15px;
}

.input-box input::placeholder{
    color:#cbd5e1;
}

.input-box i{
    position:absolute;
    top:50%;
    transform:translateY(-50%);
    color:#cbd5e1;
}

.input-box .left{
    left:15px;
}

.input-box .right{
    right:15px;
    cursor:pointer;
}

button{
    width:100%;
    padding:14px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    background:#2563eb;
    transform:translateY(-2px);
}

.back{
    text-align:center;
    margin-top:20px;
}

.back a{
    text-decoration:none;
    color:#93c5fd;
    font-size:15px;
}

.back a:hover{
    color:white;
}
</style>
</head>

<body>

<div class="container">

    <div class="card">

        <h2>Change Password</h2>
        <p>Update your account password</p>

        <form action="/myapp/changepassword_post/" method="post">
            {% csrf_token %}
            <div class="input-box">
                <i class="fa-solid fa-lock left"></i>
                <input type="password" name="currentpass" id="currentpass" placeholder="Current Password">
                {% if messages %}
                {% for i in messages %}
                <p style="color: red;">{{i}}</p>
                {% endfor %}
                {% endif %}
                <i class="fa-solid "></i>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-key left"></i>
                <input type="password" name="newpass" id="newpass" placeholder="New Password">
                <p id="msg2" style="color: red;"></p>
                <i class="fa-solid "></i>
            </div>

            <div class="input-box">
                <i class="fa-solid fa-shield-halved left"></i>
                <input type="password" name="confirmpass" id="confirmpass"  placeholder="Confirm New Password">
                <p id="msg"></p>
                <i class="fa-solid t"></i>
            </div>

            <button type="submit">
                <i class="fa-solid fa-rotate"></i>
                Change Password
            </button>

        </form>

       

    </div>

</div>
<script>
$(document).ready(function(){
    $('#confirmpass').keyup(function(){
        let confirmpass=$('#confirmpass').val()
        let newpass=$("#newpass").val()
        if(confirmpass != newpass ){
            document.getElementById('msg').style.color='red';
            $("#msg").html('password doesnt match');
        }
        else if(confirmpass =='' && newpass == ''){
            $("#msg").html('');
        }
        else{
            document.getElementById('msg').style.color='green';
             $("#msg").html('password matched');
        }
    })
    $("#newpass").keyup(function(){
        let newpass=$("#newpass").val()
        let count=newpass.length
        if(count == 0){
            $("#msg2").html('');
        }
        else if (count<4){
            $("#msg2").html('password must be 4 charectors');
        }
        else{
            $("#msg2").html('');
        }
    })
    

})

</script>

button:hover{

}

button:active{
    transform:scale(.98);
}

.back{
    margin-top:20px;

}

.back a{
    color:#93c5fd;
    text-decoration:none;
    transition:.3s;
}

.back a:hover{
    color:#fff;
}

@keyframes fadeIn{
    from{
        opacity:0;
        transform:translateY(30px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@media(max-width:500px){

.container{
    width:90%;
}

.card{
    padding:25px;
}

.card h2{
    font-size:24px;
}

}
</style>
</body>
</html>
