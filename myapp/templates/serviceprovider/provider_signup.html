<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Service Provider Registration</title>

<link rel="stylesheet" href="service_provider_signup.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>


</head>
<body>

<div class="container">

    <div class="left">

        <h1>Join as a Service Provider</h1>

        <p>
            Register your service and connect with thousands of customers looking
            for trusted professionals.
        </p>

        

    </div>


    <div class="right">

        <h2>Create Account</h2>

        <form action="/myapp/provider_signup_post/" method="post" enctype="multipart/form-data">
            {% csrf_token %}

            <div class="row">

                <div class="input-box">
                    <label>Full Name</label>
                                 <input 
    type="text"
    name="name"
    pattern="[a-z0-9]{3,20}[@][a-z][.][a-z.]{2,10}"
    title="Enter a valid name"
    placeholder="Full Name"
    required>
                </div>

                <div class="input-box">
                    <label>Email</label>
<div class="input-box">

                        <i class="fa-solid fa-envelope"></i>

                        <input
                                type="email"
                                name="email"
                                id="email"
                                placeholder="Email Address"
                                pattern="[a-z0-9]{3,20}[@][a-z][.][a-z.]{2,10}"
                            title="enter a valid email"
                            required>

                        <small id="emailError" style="color: red;"
                               class="error-message"></small>

                        <small id="pid"
                               class="error-message"></small>

                    </div>              </div>

            </div>


            <div class="row">

                <div class="input-box">
                    <label>Phone Number</label>
                    <input type="tel" name="phone" placeholder="Phone Number">
                </div>

                <div class="input-box">
                    <label>Date of Birth</label>
                    <input 
    type="date"
    name="dob"
    id="dob"
    max="2008-08-15"
    required
>
                </div>

            </div>


            <div class="row">

                <div class="input-box">
                    <label>Place</label>
                    <input type="text" placeholder="Your Place" name="place">
                </div>

                <div class="input-box">
                    <label>Gender</label>

                    <select name="gender" >
                        <option>Select Gender</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Others">Other</option>
                    </select>

                </div>

            </div>


            <div class="row">

                <div class="input-box">
                    <label>Service Type</label>

                    <select name="servicetype">
                        <option>Select Service</option>
                        <option value="Electrician">Electrician</option>
                        <option value="Plumber">Plumber</option>
                        <option value="Painter">Painter</option>
                        <option value="Carpenter">Carpenter</option>
                        <option value="Mechanic">Mechanic</option>
                    </select>

                </div>

                <div class="input-box">
                    <label>Profile Photo</label>
                    <input type="file" name="photo">
                </div>
                
                

            </div>
            <div class="input-box">
                    <label>password</label>
                    <input type="text" placeholder="password" id="password" name="password">
                    <p id="msg2" style="color: red;"></p>
                </div>


            <button type="submit">
                Register Now
            </button>

            <p class="login">
                Already have an account?
                <a href="/myapp/login_page/">Login</a>
            </p>

        </form>

    </div>

</div>
<script>
    $(document).ready(function(){
            $("#password").keyup(function(){
        let newpass=$("#password").val()
        let count=newpass.length
        if(count == 0){
            console.log('hiiiiiiiiiiiiiiiiiiiiii')
            $("#msg2").html('');
        }
        else if (count<4){
            $("#msg2").html('password must be 4 charectors');
        }
        else{
            $("#msg2").html('');
        }
    })
    })
</script>

<style>
    *{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",sans-serif;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b,#0f172a);
    padding:40px;
}

.container{
    width:1100px;
    max-width:100%;
    display:flex;
    background:rgba(255,255,255,.08);
    backdrop-filter:blur(15px);
    border:1px solid rgba(255,255,255,.15);
    border-radius:20px;
    overflow:hidden;
    box-shadow:0 20px 40px rgba(0,0,0,.4);
}

/* LEFT SIDE */

.left{
    width:38%;
    background:linear-gradient(135deg,#2563eb,#1d4ed8,#1e40af);
    color:white;
    padding:60px 40px;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    text-align:center;
}

.left h1{
    font-size:38px;
    margin-bottom:20px;
}

.left p{
    line-height:28px;
    font-size:17px;
    margin-bottom:40px;
    color:#e2e8f0;
}

.left img{
    width:260px;
    animation:float 3s ease-in-out infinite;
}

/* RIGHT SIDE */

.right{
    width:62%;
    padding:45px;
}

.right h2{
    text-align:center;
    color:white;
    margin-bottom:35px;
    font-size:32px;
}

.row{
    display:flex;
    gap:20px;
    margin-bottom:22px;
}

.input-box{
    width:100%;
}

.input-box label{
    display:block;
    color:#cbd5e1;
    margin-bottom:8px;
    font-size:15px;
}

.input-box input,
.input-box select{
    width:100%;
    height:50px;
    border:none;
    outline:none;
    border-radius:10px;
    padding:0 15px;
    background:rgba(255,255,255,.12);
    color:white;
    font-size:15px;
    transition:.3s;
}

.input-box input[type=file]{
    padding:12px;
    cursor:pointer;
}

.input-box input::placeholder{
    color:#94a3b8;
}

.input-box select option{
    color:black;
}

.input-box input:focus,
.input-box select:focus{
    border:1px solid #3b82f6;
    box-shadow:0 0 12px rgba(59,130,246,.5);
    background:rgba(255,255,255,.18);
}

button{
    width:100%;
    height:55px;
    border:none;
    border-radius:10px;
    background:#3b82f6;
    color:white;
    font-size:18px;
    font-weight:bold;
    cursor:pointer;
    transition:.3s;
    margin-top:10px;
}

button:hover{
    background:#2563eb;
    transform:translateY(-3px);
    box-shadow:0 10px 20px rgba(37,99,235,.4);
}

.login{
    text-align:center;
    color:#cbd5e1;
    margin-top:25px;
}

.login a{
    color:#60a5fa;
    text-decoration:none;
    font-weight:bold;
}

.login a:hover{
    color:white;
}

/* Floating Animation */

@keyframes float{

    0%{
        transform:translateY(0px);
    }

    50%{
        transform:translateY(-15px);
    }

    100%{
        transform:translateY(0px);
    }

}

/* Responsive */

@media(max-width:900px){

.container{
    flex-direction:column;
}

.left,
.right{
    width:100%;
}

.left{
    padding:40px 25px;
}

.left img{
    width:180px;
}

.row{
    flex-direction:column;
    gap:0;
}

.right{
    padding:30px;
}

}

@media(max-width:500px){

body{
    padding:15px;
}

.left h1{
    font-size:28px;
}

.right h2{
    font-size:25px;
}

button{
    font-size:16px;
}

}
</style>
</body>
</html>
